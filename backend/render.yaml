services:
  # Python Flask REST API Service
  - type: web
    name: employee-management-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: employee-management-db
          property: connectionString

# Optional Render Managed PostgreSQL Database
databases:
  - name: employee-management-db
    region: oregon
    plan: free
    databaseName: employeedb
    user: employeeuser
